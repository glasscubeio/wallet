# ---------------------------------------------------------------------------
# API — wa.glasscube.uz -> Bun on 127.0.0.1:9550
#
# Rate limiting lives here and ONLY here. The app deliberately carries no
# limiter of its own — two independent limits on the same traffic just means
# two places to look when a legitimate request gets a 429.
#
# Consequence worth knowing: run the API without this proxy in front and it is
# unthrottled. Don't expose port 9550 directly.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=hamyon_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=hamyon_auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=hamyon_send:10m    rate=20r/m;
limit_conn_zone $binary_remote_addr zone=hamyon_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name wa.glasscube.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wa.glasscube.uz;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
    limit_conn hamyon_conn 20;

    access_log /var/log/nginx/hamyon-api.access.log;
    error_log  /var/log/nginx/hamyon-api.error.log;

    # Shared proxy settings. X-Forwarded-For matters: the app runs with
    # `trust proxy` on and reads req.ip from it for its own rate limits.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 90s;

    # Credentials, reset codes, account deletion — the expensive things to guess.
    location ~ ^/api/auth/(login|register|forgot-password|reset-password|change-password|delete-account) {
        limit_req zone=hamyon_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9550;
    }

    # Every send emails a code, so this bounds outbound mail too.
    location ~ ^/api/wallet/send {
        limit_req zone=hamyon_send burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9550;
    }

    location / {
        limit_req zone=hamyon_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9550;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:9550;
    }
}
